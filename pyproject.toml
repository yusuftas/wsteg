[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wsteg"
dynamic = ["version"]
description = "Desktop workbench for audio (WAV) steganography CTF challenges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PySide6-Essentials>=6.6", "pyqtgraph>=0.13.7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]
test = ["pytest"]

[project.scripts]
wsteg = "wsteg.__main__:main"

[project.gui-scripts]
wsteg-gui = "wsteg.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "wsteg.__version__" }

[tool.setuptools.packages.find]
include = ["wsteg*"]

[tool.setuptools.package-data]
"wsteg.gui" = ["*.png"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731", "E741", "E702"]  # long lines, lambdas, short names and one-line statements are fine here

[tool.ruff.lint.per-file-ignores]
"packaging/wsteg.spec" = ["F821"]  # PyInstaller injects Analysis/EXE/...

[tool.pytest.ini_options]
testpaths = ["tests"]
