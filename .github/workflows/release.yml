# Push a tag like v0.2.0 (see RELEASING.md) to publish a GitHub Release with
# Windows + Linux builds attached. Tags with a suffix (v0.2.0-rc1) become pre-releases.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches wsteg.__version__
        run: |
          v=$(python -c "import wsteg; print(wsteg.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "${v%%-*}" ] || { echo "::error::tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: python scripts/release.py notes "${GITHUB_REF_NAME#v}"

  test:
    needs: verify
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      WSTEG_NO_AUDIO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py notes "${GITHUB_REF_NAME#v}" > notes.md
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag $pre \
            --title "wsteg $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
